<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tablero de Contenido</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Tema verde hierba + modo oscuro por clase. (Pedido del brief.)
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            grass: {
              50: '#f7fee7', 100: '#ecfccb', 200: '#d9f99d', 300: '#bef264',
              400: '#a3e635', 500: '#84cc16', 600: '#65a30d', 700: '#4d7c0f',
              800: '#3f6212', 900: '#365314',
            },
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        },
      },
    };
  </script>
  <style>
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #4d7c0f; border-radius: 6px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 antialiased">
  <div id="app" class="flex min-h-screen"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
